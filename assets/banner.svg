<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="SentinelAI — multi-signal AI content detection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0714"/>
      <stop offset="0.55" stop-color="#130b2b"/>
      <stop offset="1" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#241a44" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.6"/>

  <g transform="translate(1000 160)" fill="none" stroke="url(#accent)" stroke-width="2">
    <path d="M-92 0 C-58 -54 -22 -72 0 -72 C22 -72 58 -54 92 0 C58 54 22 72 0 72 C-22 72 -58 54 -92 0 Z" fill="#130b2b"/>
    <circle cx="0" cy="0" r="34" stroke="#a78bfa"/>
    <circle cx="0" cy="0" r="12" fill="#22d3ee" stroke="none"/>
    <path d="M-70 -42 L-104 -70 M70 -42 L104 -70 M-70 42 L-104 70 M70 42 L104 70" stroke="#4c1d95"/>
  </g>

  <g stroke="#2b1f52" stroke-width="1.3">
    <path d="M720 250 L820 210 L910 240 L1010 300"/>
    <path d="M820 210 L860 120"/>
  </g>
  <g fill="#120b28" stroke="url(#accent)" stroke-width="1.8">
    <circle cx="720" cy="250" r="6"/>
    <circle cx="820" cy="210" r="8"/>
    <circle cx="910" cy="240" r="6"/>
    <circle cx="1010" cy="300" r="5"/>
    <circle cx="860" cy="120" r="5"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#c4b5fd" font-size="17" letter-spacing="6" font-weight="600">MULTI-SIGNAL CONTENT FORENSICS</text>
    <text x="70" y="206" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-1">SentinelAI</text>
    <text x="73" y="247" fill="#c9c2e8" font-size="21">Read the signal behind the text — sentence by sentence.</text>
    <text x="73" y="281" fill="#7d74a8" font-size="15" letter-spacing="1.5">PERPLEXITY  ·  BURSTINESS  ·  CLASSIFIER  ·  STYLOMETRY  ·  UNCERTAINTY</text>
  </g>
  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
